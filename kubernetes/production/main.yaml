apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasirciogli.multicloud.csi.driver
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hasirciogli.multicloud.csi.driver
  template:
    metadata:
      labels:
        app: hasirciogli.multicloud.csi.driver
    spec:
      containers:
      - name: hasirciogli.multicloud.csi.driver
        image: hasirciogli/multicloud-csi-driver:latest
        args:
          - --endpoint=unix:///csi/csi.sock
        volumeMounts:
          - mountPath: /csi
            name: csi-sock
      volumes:
        - name: csi-sock
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: hasirciogli.multicloud.csi.driver
  namespace: kube-system
spec:
  selector:
    app: hasirciogli.multicloud.csi.driver
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hasirciogli.multicloud.csi.hdd-storage-class
provisioner: hasirciogli.multicloud.csi.driver
parameters:
  type: "hdd"
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hasirciogli.multicloud.csi.nvme-storage-class
provisioner: hasirciogli.multicloud.csi.driver
parameters:
  type: "nvme"
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hasirciogli.multicloud.csi.ssd-storage-class
provisioner: hasirciogli.multicloud.csi.driver
parameters:
  type: "ssd"
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hasirciogli.multicloud.csi.fast-ssd-storage-class
provisioner: hasirciogli.multicloud.csi.driver
parameters:
  type: "fast-ssd"
reclaimPolicy: Delete
volumeBindingMode: Immediate