# ServiceAccount, ClusterRole ve ClusterRoleBinding
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multicloud-csi-driver
  namespace: kube-system
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: multicloud-csi-driver
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes", "nodes", "secrets"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments", "storageclasses"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: multicloud-csi-driver
subjects:
  - kind: ServiceAccount
    name: multicloud-csi-driver
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: multicloud-csi-driver
  apiGroup: rbac.authorization.k8s.io
---
# CSI Driver Registration
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: multicloud.csi.k8s.io
spec:
  attachRequired: true
  podInfoOnMount: true
  volumeLifecycleModes:
    - Persistent
---
# Controller Deployment
kind: Deployment
apiVersion: apps/v1
metadata:
  name: multicloud-csi-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multicloud-csi-controller
  template:
    metadata:
      labels:
        app: multicloud-csi-controller
    spec:
      serviceAccount: multicloud-csi-driver
      containers:
        - name: csi-controller
          image: your-registry/multicloud-csi-driver:latest
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--mode=controller"
          env:
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
      volumes:
        - name: socket-dir
          emptyDir: {}
---
# Node DaemonSet
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: multicloud-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: multicloud-csi-node
  template:
    metadata:
      labels:
        app: multicloud-csi-node
    spec:
      serviceAccount: multicloud-csi-driver
      hostNetwork: true
      containers:
        - name: csi-node-driver
          image: your-registry/multicloud-csi-driver:latest
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--mode=node"
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: "Bidirectional"
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/multicloud.csi.k8s.io
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
---
# StorageClass
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: multicloud-standard
provisioner: multicloud.csi.k8s.io
parameters:
  type: standard